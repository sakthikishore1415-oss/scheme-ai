name: Build & Release Mobile Apps (Android & iOS)

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'
      release_name:
        description: 'Release Title'
        required: true
        default: 'PACS Sahayak Mobile v1.0.0'
      prerelease:
        description: 'Mark as Pre-release'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x apps/android/gradlew

      - name: Build Android Release APK
        working-directory: apps/android
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Prepare APK Artifact
        run: |
          mkdir -p build-output
          find apps/android/app/build/outputs/apk/ -name "*.apk" -exec cp {} build-output/pacs-sahayak.apk \;
          ls -la build-output/

      - name: Upload Android APK
        uses: actions/upload-artifact@v6
        with:
          name: pacs-sahayak-android-apk
          path: build-output/pacs-sahayak.apk
          if-no-files-found: error

  build-ios:
    name: Build iOS IPA
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Select Xcode Version
        run: sudo xcode-select -switch /Applications/Xcode_15.4.app || sudo xcode-select -switch /Applications/Xcode.app

      - name: Print Xcode Version
        run: xcodebuild -version

      - name: Archive iOS Application (Device SDK / xcarchive)
        working-directory: apps/ios
        run: |
          mkdir -p build
          xcodebuild \
            -project PACSSahayak.xcodeproj \
            -scheme PACSSahayak \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/PACSSahayak.xcarchive" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            archive

      - name: Package & Verify Installable IPA
        working-directory: apps/ios
        run: |
          ARCHIVE_APP="$PWD/build/PACSSahayak.xcarchive/Products/Applications/PACSSahayak.app"
          if [ ! -d "$ARCHIVE_APP" ]; then
            echo "❌ ERROR: Built PACSSahayak.app not found in xcarchive at $ARCHIVE_APP"
            exit 1
          fi

          echo "✓ Verifying compiled Mach-O binary executable..."
          if [ ! -f "$ARCHIVE_APP/PACSSahayak" ]; then
            echo "❌ ERROR: Executable binary 'PACSSahayak' missing from .app bundle!"
            ls -la "$ARCHIVE_APP"
            exit 1
          fi

          BINARY_SIZE=$(stat -f%z "$ARCHIVE_APP/PACSSahayak" 2>/dev/null || stat -c%s "$ARCHIVE_APP/PACSSahayak")
          echo "✓ Executable Mach-O binary size: $BINARY_SIZE bytes"
          if [ "$BINARY_SIZE" -lt 100000 ]; then
            echo "❌ ERROR: Binary size ($BINARY_SIZE bytes) is suspiciously small. Real compiled binary must be > 100KB."
            exit 1
          fi

          echo "🔐 Applying standard ad-hoc code signature for sideloading/MDM..."
          codesign --force --deep --sign - "$ARCHIVE_APP"

          mkdir -p ../../build-output/Payload
          cp -r "$ARCHIVE_APP" ../../build-output/Payload/
          cd ../../build-output
          zip -qr9 pacs-sahayak.ipa Payload
          rm -rf Payload

          IPA_SIZE=$(stat -f%z pacs-sahayak.ipa 2>/dev/null || stat -c%s pacs-sahayak.ipa)
          echo "🎉 Packaged pacs-sahayak.ipa size: $IPA_SIZE bytes"
          if [ "$IPA_SIZE" -lt 500000 ]; then
            echo "❌ ERROR: Generated IPA ($IPA_SIZE bytes) is too small (<500KB). A genuine iOS app is several megabytes."
            exit 1
          fi
          ls -lh pacs-sahayak.ipa

      - name: Upload iOS Installable IPA Artifact
        uses: actions/upload-artifact@v6
        with:
          name: pacs-sahayak-ios-ipa
          path: build-output/pacs-sahayak.ipa
          if-no-files-found: error

  publish-release:
    name: Publish Unified GitHub Release
    needs: [build-android, build-ios]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'

    steps:
      - name: Download Android Artifact
        uses: actions/download-artifact@v7
        with:
          name: pacs-sahayak-android-apk
          path: release-assets

      - name: Download iOS Artifact
        uses: actions/download-artifact@v7
        with:
          name: pacs-sahayak-ios-ipa
          path: release-assets

      - name: Display Release Files
        run: ls -lh release-assets/

      - name: Create GitHub Release & Upload Binaries
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          name: ${{ github.event.inputs.release_name || github.ref_name }}
          draft: false
          prerelease: ${{ github.event.inputs.prerelease || false }}
          files: |
            release-assets/pacs-sahayak.apk
            release-assets/pacs-sahayak.ipa
          generate_release_notes: true
          body: |
            ## 📱 PACS Sahayak Multi-Platform Mobile Release

            ### 🤖 Android
            - **`pacs-sahayak.apk`**: Genuine Native Android APK (Kotlin + Jetpack Compose) for Android 7.0+ (API 24+) devices.

            ### 🍎 iOS
            - **`pacs-sahayak.ipa`**: Genuine Native iOS Installable Application Package (Swift + SwiftUI) for iOS 17.0+ devices (installable via AltStore, Sideloadly, TrollStore, or enterprise MDM).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
