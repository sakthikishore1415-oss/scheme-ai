name: Build & Release Mobile Apps (Android & iOS)

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'
      release_name:
        description: 'Release Title'
        required: true
        default: 'Arivom Thittam Mobile v1.0.0'
      prerelease:
        description: 'Mark as Pre-release'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x apps/android/gradlew

      - name: Build Android Debug APK
        working-directory: apps/android
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare APK Artifact
        run: |
          mkdir -p build-output
          find apps/android/app/build/outputs/apk/ -name "*.apk" -exec cp {} build-output/arivom-thittam.apk \;
          ls -la build-output/

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: arivom-thittam-android-apk
          path: build-output/arivom-thittam.apk
          if-no-files-found: error

  build-ios:
    name: Build iOS IPA & Simulator App
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: sudo xcode-select -switch /Applications/Xcode_15.4.app || sudo xcode-select -switch /Applications/Xcode.app

      - name: Print Xcode Version
        run: xcodebuild -version

      - name: Build iOS Application (Device SDK / iphoneos)
        working-directory: apps/ios
        run: |
          xcodebuild \
            -project ArivomThittam.xcodeproj \
            -scheme ArivomThittam \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package Installable IPA
        working-directory: apps/ios
        run: |
          mkdir -p ../../build-output/Payload
          BUILD_DIR=$(xcodebuild -project ArivomThittam.xcodeproj -scheme ArivomThittam -sdk iphoneos -configuration Release -showBuildSettings | grep -m 1 " BUILT_PRODUCTS_DIR =" | awk '{print $3}')
          echo "Built products directory (iphoneos): $BUILD_DIR"
          if [ -d "$BUILD_DIR/ArivomThittam.app" ]; then
            cp -r "$BUILD_DIR/ArivomThittam.app" ../../build-output/Payload/
            cd ../../build-output
            zip -qr arivom-thittam.ipa Payload
            rm -rf Payload
          else
            echo "ArivomThittam.app not found in $BUILD_DIR"
            exit 1
          fi
          ls -la "$GITHUB_WORKSPACE/build-output/"

      - name: Build iOS Simulator App (for Mac/Simulator testing)
        working-directory: apps/ios
        run: |
          xcodebuild \
            -project ArivomThittam.xcodeproj \
            -scheme ArivomThittam \
            -destination "generic/platform=iOS Simulator" \
            -configuration Release \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            CODE_SIGNING_ALLOWED=NO \
            build

          SIM_BUILD_DIR=$(xcodebuild -project ArivomThittam.xcodeproj -scheme ArivomThittam -destination "generic/platform=iOS Simulator" -configuration Release -showBuildSettings | grep -m 1 " BUILT_PRODUCTS_DIR =" | awk '{print $3}')
          echo "Built products directory (Simulator): $SIM_BUILD_DIR"
          if [ -d "$SIM_BUILD_DIR/ArivomThittam.app" ]; then
            cd "$SIM_BUILD_DIR"
            zip -qr "$GITHUB_WORKSPACE/build-output/arivom-thittam-ios-simulator.zip" ArivomThittam.app
          fi

      - name: Upload iOS Installable IPA & Simulator Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: arivom-thittam-ios-builds
          path: |
            build-output/arivom-thittam.ipa
            build-output/arivom-thittam-ios-simulator.zip
          if-no-files-found: error

  publish-release:
    name: Publish Unified GitHub Release
    needs: [build-android, build-ios]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'

    steps:
      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: arivom-thittam-android-apk
          path: release-assets

      - name: Download iOS Artifacts
        uses: actions/download-artifact@v4
        with:
          name: arivom-thittam-ios-builds
          path: release-assets

      - name: Display Release Files
        run: ls -lh release-assets/

      - name: Create GitHub Release & Upload Binaries
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          name: ${{ github.event.inputs.release_name || github.ref_name }}
          draft: false
          prerelease: ${{ github.event.inputs.prerelease || false }}
          files: |
            release-assets/arivom-thittam.apk
            release-assets/arivom-thittam.ipa
            release-assets/arivom-thittam-ios-simulator.zip
          generate_release_notes: true
          body: |
            ## 📱 Arivom Thittam Multi-Platform Mobile Release

            ### 🤖 Android
            - **`arivom-thittam.apk`**: Genuine Native Android APK (Kotlin + Jetpack Compose) for Android 7.0+ (API 24+) devices.

            ### 🍎 iOS
            - **`arivom-thittam.ipa`**: Native iOS Installable Application Package (Swift + SwiftUI) for iOS 17.0+ devices (installable via AltStore, Sideloadly, TrollStore, or enterprise MDM).
            - **`arivom-thittam-ios-simulator.zip`**: iOS Simulator build for testing on macOS with Xcode Simulator.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
