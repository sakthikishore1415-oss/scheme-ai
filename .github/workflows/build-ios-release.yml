name: Build & Release iOS App

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.0.0-ios)'
        required: true
        default: 'v1.0.0-ios'
      release_name:
        description: 'Release Title'
        required: true
        default: 'Arivom Thittam iOS v1.0.0'
      prerelease:
        description: 'Mark as Pre-release'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-ios:
    name: Build iOS App & Release
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: sudo xcode-select -switch /Applications/Xcode_15.4.app || sudo xcode-select -switch /Applications/Xcode.app

      - name: Print Xcode Version
        run: xcodebuild -version

      - name: Build iOS Application (Simulator Build)
        working-directory: apps/ios
        run: |
          xcodebuild \
            -project ArivomThittam.xcodeproj \
            -scheme ArivomThittam \
            -destination "generic/platform=iOS Simulator" \
            -configuration Release \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Archive App Bundle
        working-directory: apps/ios
        run: |
          mkdir -p ../../build-output
          # Locate built app and zip it
          BUILD_DIR=$(xcodebuild -project ArivomThittam.xcodeproj -scheme ArivomThittam -showBuildSettings | grep -m 1 " BUILT_PRODUCTS_DIR =" | awk '{print $3}')
          echo "Built products directory: $BUILD_DIR"
          if [ -d "$BUILD_DIR/ArivomThittam.app" ]; then
            cd "$BUILD_DIR"
            zip -r "$GITHUB_WORKSPACE/build-output/ArivomThittam-iOS-Simulator.zip" ArivomThittam.app
          fi
          ls -la "$GITHUB_WORKSPACE/build-output/"

      - name: Upload iOS App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: arivom-thittam-ios-app
          path: build-output/ArivomThittam-iOS-Simulator.zip
          if-no-files-found: warn

      - name: Create GitHub Release & Upload iOS App
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.event.inputs.tag_name }}
          name: ${{ github.event.inputs.release_name }}
          draft: false
          prerelease: ${{ github.event.inputs.prerelease }}
          files: build-output/ArivomThittam-iOS-Simulator.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
